// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    // Uploads the R8 mapping file so Java/Kotlin stack traces deobfuscate in
    // Sentry. @sentry/react-native's sentry.gradle handles the JS bundle and
    // source maps ONLY -- it has no ProGuard/mapping support at all -- so
    // without this plugin, enabling R8 would turn every native-layer crash
    // (MediaInfo turbomodule, SafCueReader, RNTP, Glide OOM) into
    // `a.b.c(Unknown Source)`. Configured narrowly in app/build.gradle.
    classpath('io.sentry:sentry-android-gradle-plugin:6.19.0')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

ext {
  ndkVersion = "27.2.12479018"
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
